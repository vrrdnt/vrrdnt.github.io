name: Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test project filters and Conway patterns
        run: npm test
      - name: Restore last repository snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/repositories.json
          key: public-repos-${{ github.run_id }}
          restore-keys: public-repos-
      - name: Refresh public repositories
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Cache repository snapshot
        uses: actions/cache/save@v4
        with:
          path: data/repositories.json
          key: public-repos-${{ github.run_id }}
      - name: Build static site
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
